<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Timer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">
</head>

<body>

    <!-- ── Settings bar ─────────────────────────────────────────── -->
    <div class="settings">
        <span class="settings-brand">Exam Timer</span>

        <form id="timerSettings">
            <div class="field-group">
                <label for="duration">Duration</label>
                <input type="number" id="duration" min="1" max="600" value="60" />
                <span style="font-size:12px;color:var(--fg-muted);font-weight:500;">min</span>
            </div>

            <div class="field-group">
                <label class="checkbox-wrap" for="extraTimeToggle">
                    <input type="checkbox" id="extraTimeToggle" />
                    Extra time (+25%)
                </label>
            </div>
        </form>

        <div class="settings-actions">
            <button class="btn btn-primary" id="start" type="submit" form="timerSettings"
                title="Start at the next whole minute">
                Set times
            </button>
            <button class="btn btn-primary" id="applyExtraTime" type="button" style="display:none;"
                onclick="applyExtraTimeChange()">
                Apply extra time
            </button>
            <button class="btn btn-secondary" type="button" onclick="resetClock(event)">Reset</button>
            <button class="btn btn-icon" id="fullscreenBtn" title="Fullscreen">⛶</button>
        </div>
    </div>

    <!-- ── Main display ─────────────────────────────────────────── -->
    <div class="center">
        <div id="waitingLabel" class="waiting-label"></div>

        <div class="clock-wrap">
            <div class="clock-rule"></div>
            <div id="clock">--:--:--</div>
        </div>

        <div class="timeInfo">
            <div class="time-block">
                <div class="time-label">Start</div>
                <div class="time-value" id="startTime">&nbsp;</div>
                <div class="time-status"></div>
            </div>

            <div class="time-divider"></div>

            <div class="time-block">
                <div class="time-label">End</div>
                <div class="time-value" id="endTime">&nbsp;</div>
                <div class="time-status" id="endTimeStatus"></div>
            </div>

            <div class="time-divider" id="extraTimeDivider" style="display:none;"></div>

            <div class="time-block" id="extraTimeInfo">
                <div class="time-label">Extra time</div>
                <div class="time-value" id="extraEndTime">&nbsp;</div>
                <div class="time-status" id="extraEndTimeStatus"></div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
